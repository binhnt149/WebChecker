name: Build and release SiteSentry Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
          - os: macos-15-intel
            platform: macOS-x64
          - os: macos-15
            platform: macOS-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Validate release version
        shell: bash
        run: python -m scripts.validate_release
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Build macOS DMG
        if: runner.os == 'macOS'
        env:
          PYTHON_BIN: python
        run: bash scripts/build_macos.sh
      - name: Stage versioned packages
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: python -m scripts.stage_release
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: SiteSentry-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: SiteSentry-*
          path: release
          merge-multiple: true
      - name: Verify complete release and create checksums
        run: python -m scripts.stage_release --verify
      - name: Publish release with all installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "SiteSentry Desktop $RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url --jq .url
