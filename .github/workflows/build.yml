name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build DMG
        run: |
          PYTHON_BIN=python bash scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SiteSentry-Desktop-macOS
          path: dist/SiteSentry-Desktop-macOS.dmg

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build EXE
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SiteSentry-Desktop-Windows
          path: |
            dist/SiteSentry Desktop.exe
            dist/SiteSentry-Desktop-Windows.zip
